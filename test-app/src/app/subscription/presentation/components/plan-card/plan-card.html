<div class="card plan-card" [class.plan-highlighted]="plan().highlighted">
  @if (plan().highlighted) {
    <span class="badge badge-warning plan-tag">Más popular</span>
  }

  <h3>{{ plan().name }}</h3>

  <div class="plan-price">
    <span class="amount">{{ plan().formattedPrice() }}</span>
    <span class="period">/mes</span>
  </div>

  <ul class="plan-features">
    @for (feature of plan().features; track feature) {
      <li>{{ feature }}</li>
    }
  </ul>

  @if (confirmed()) {
    <p class="badge badge-success plan-confirmation">✓ Suscripción activada</p>
  } @else {
    <div class="plan-actions">
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="processing() || disabled()"
        (click)="pay.emit('STRIPE')"
      >
        {{ processing() ? 'Procesando…' : 'Pagar con Stripe' }}
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        [disabled]="processing() || disabled()"
        (click)="pay.emit('PAYPAL')"
      >
        Pagar con PayPal
      </button>
    </div>
  }
</div>
